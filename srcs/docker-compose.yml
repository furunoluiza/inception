version: "3.8"

services:
  mariadb:
    build: requirements/mariadb
    image: mariadb
    container_name: mariadb
    restart: always

    env_file:
      - .env

    secrets:
      - db_root_password
      - wp_db_password

    volumes:
      - mariadb_data:/var/lib/mysql

    networks:
      - inception

networks:
  inception:
    driver: bridge

volumes:
  mariadb_data:

secrets:
  db_root_password:
    file: ../secrets/db_root_password
  wp_db_password:
    file: ../secrets/wp_db_password
