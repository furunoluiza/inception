server {
    # Escuta conexões HTTPS na porta 443
    # ssl é uma conexão segura e http2 é uma versão nova do protocolo HTTP
    listen 443 ssl http2;

    # Nome do servidor (domínio)
    # Precisa bater com o CN do certificado SSL
    server_name localhost;

    # Caminho dos certificados SSL
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Protocolos TLS permitidos (mínimo exigido: TLSv1.2)
    ssl_protocols TLSv1.2 TLSv1.3;

    # Diretório raiz do WordPress (volume compartilhado com PHP-FPM)
    root /var/www/html;

    # Arquivos padrão
    index index.php index.html;

    # Tratamento padrão do WordPress
    # Se o arquivo não existir, redireciona para index.php
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Processamento de arquivos PHP via PHP-FPM
    location ~ \.php$ {
        # Parâmetros padrão do FastCGI
        include fastcgi_params;

        # Caminho absoluto do script PHP
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # Nome do serviço PHP-FPM no docker-compose + porta
        fastcgi_pass wp-php:9000;

        # Evita timeout em páginas mais pesadas do WordPress
        fastcgi_read_timeout 60s;
    }
}
